<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
    <main class="min-h-screen bg-black">
        <h1 class="text-white text-center mb-10 pt-10 text-3xl uppercase font-bold">calculator</h1>
        <div class="flex flex-col
        justify-center items-center m-auto" id="calculator">
            <input class="bg-gray-300 p-8 w-100 text-xl" id="output" type="text">
            <div class="grid grid-cols-4">
                <button class="bg-white w-25 cursor-pointer border-1 h-25">1</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">2</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">3</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">+</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">4</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">5</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">6</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">-</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">7</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">8</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">9</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">*</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">0</button>
                <button class="bg-white w-25 cursor-pointer border-1 h-25">/</button>
                <button class="bg-green-500 w-25 cursor-pointer border-1 h-25">=</button>
                <button class="bg-red-600 w-25 cursor-pointer border-1 h-25">ac</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
